---
apiVersion: v1
kind: Namespace
metadata:
  name: aiops-system
  labels:
    app.kubernetes.io/name: aiops-operator
    app.kubernetes.io/part-of: aiops-self-healing-engine

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-operator
  namespace: aiops-system
  labels:
    app.kubernetes.io/name: aiops-operator
    app.kubernetes.io/part-of: aiops-self-healing-engine

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiops-operator-role
  labels:
    app.kubernetes.io/name: aiops-operator
    app.kubernetes.io/part-of: aiops-self-healing-engine
rules:
  # Pod observability, telemetry annotation, and status inspection
  - apiGroups: [""]
    resources:
      - pods
      - pods/status
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - delete

  # Safe eviction subresource respecting PodDisruptionBudgets (PDBs)
  - apiGroups: ["", "policy"]
    resources:
      - pods/eviction
    verbs:
      - create

  # Native Kubernetes Event emission for auditable SRE post-mortem inspection
  - apiGroups: [""]
    resources:
      - events
    verbs:
      - create
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiops-operator-binding
  labels:
    app.kubernetes.io/name: aiops-operator
    app.kubernetes.io/part-of: aiops-self-healing-engine
subjects:
  - kind: ServiceAccount
    name: aiops-operator
    namespace: aiops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiops-operator-role
